name: COTEGO tests
on:
  push:
    branches: [main, feature/fresh-football-data-adapter, feature/cotego-premium-ux]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test des résultats et du proxy (sans clé réelle)
        run: node --test src/*.test.mjs

  smoke-preview:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/feature/cotego-premium-ux'
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Cloudflare Preview API configuration
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://feature-cotego-premium-ux-cotego.salama-jimmy.workers.dev'
          ready=0
          missing_secret_count=0
          last_http='none'
          for attempt in $(seq 1 10); do
            rm -f /tmp/cotego-health.json
            status=$(curl --silent --show-error --max-time 15 --output /tmp/cotego-health.json --write-out '%{http_code}' "$BASE/api/status" || true)
            last_http="$status"
            if [ "$status" = '200' ] && jq -e '.ok==true and .footballDataConfigured==true' /tmp/cotego-health.json >/dev/null 2>&1; then
              ready=1
              break
            fi
            if [ "$status" = '200' ] && jq -e '.ok==true and .footballDataConfigured==false' /tmp/cotego-health.json >/dev/null 2>&1; then
              missing_secret_count=$((missing_secret_count + 1))
              echo "Preview Worker responds but API key binding is missing (attempt $attempt)"
              if [ "$missing_secret_count" -ge 3 ]; then
                echo '::error title=Cloudflare Worker binding absent::Preview Worker returned footballDataConfigured=false three times. Verify FOOTBALL_DATA_API_KEY is bound to the deployed preview Worker (not just the GitHub Actions environment or a different Cloudflare environment).'
                exit 1
              fi
            else
              missing_secret_count=0
              echo "Preview status unavailable or malformed: HTTP $status (attempt $attempt)"
            fi
            if [ "$attempt" -lt 10 ]; then sleep 12; fi
          done
          if [ "$ready" != '1' ]; then
            echo "::error title=Cloudflare Preview unavailable::Health check did not become ready (last HTTP $last_http). Inspect preview URL, deployment and Worker logs."
            exit 1
          fi
          echo 'Preview API status is healthy'
      - name: Check actual Ligue 1 match feed and freshness
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://feature-cotego-premium-ux-cotego.salama-jimmy.workers.dev'
          code=$(curl --silent --show-error --max-time 25 --output /tmp/cotego-football.json --write-out '%{http_code}' "$BASE/api/football/fr.1" || true)
          if [ "$code" != '200' ] || ! jq -e '.ok==true and (.matches|length>=20) and .freshness.latestFinishedAt!=null' /tmp/cotego-football.json >/dev/null 2>&1; then
            echo 'COTEGO Preview football data missing; inspect Cloudflare Preview secret and API provider'
            head -c 700 /tmp/cotego-football.json || true
            exit 1
          fi
          echo 'Verified delayed football data available'
      - name: Verify five-league featured feed structure
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://feature-cotego-premium-ux-cotego.salama-jimmy.workers.dev'
          code=$(curl --silent --show-error --max-time 55 --output /tmp/cotego-featured.json --write-out '%{http_code}' "$BASE/api/football-featured" || true)
          if [ "$code" != '200' ] || ! jq -e '
            .ok==true and .source=="football-data.org" and
            (.competitions|type=="array" and length==5) and
            ([.competitions[].league]|sort)==(["fr.1","en.1","es.1","de.1","it.1"]|sort) and
            all(.competitions[]; (.ok|type)=="boolean" and (if .ok then (.matches|type)=="array" else (.error|type)=="string" end))
          ' /tmp/cotego-featured.json >/dev/null 2>&1; then
            echo '::error title=Five-league feed invalid::The preview featured feed is unavailable or missing a competition/status.'
            head -c 900 /tmp/cotego-featured.json || true
            exit 1
          fi
          jq -r '.competitions[] | "\(.league): \(if .ok then "available" else "unavailable" end)"' /tmp/cotego-featured.json
          echo 'All five competitions explicitly represented; individual upstream failures are not hidden.'

  browser-preview:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/feature/cotego-premium-ux'
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for UI regression checks
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check mobile and desktop navigation, modal and demo forecast
        run: node src/e2e-preview.mjs
