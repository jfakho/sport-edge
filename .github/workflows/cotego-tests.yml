name: COTEGO tests
on:
  push:
    branches: [main, feature/fresh-football-data-adapter, feature/cotego-premium-ux]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test des résultats et du proxy (sans clé réelle)
        run: node --test src/*.test.mjs

  smoke-preview:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/feature/cotego-premium-ux'
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Cloudflare Preview API configuration
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://feature-cotego-premium-ux-cotego.salama-jimmy.workers.dev'
          ready=0
          for attempt in $(seq 1 10); do
            status=$(curl --silent --show-error --max-time 15 --output /tmp/cotego-health.json --write-out '%{http_code}' "$BASE/api/status" || true)
            if [ "$status" = '200' ] && jq -e '.ok==true and .footballDataConfigured==true' /tmp/cotego-health.json >/dev/null 2>&1; then
              ready=1; break
            fi
            if [ "$status" = '200' ] && jq -e '.ok==true and .footballDataConfigured==false' /tmp/cotego-health.json >/dev/null 2>&1; then
              echo '::error title=Cloudflare Preview secret missing::Set FOOTBALL_DATA_API_KEY as an encrypted Worker secret for feature-cotego-premium-ux-cotego in Cloudflare. Do not paste the key into GitHub, source code, or chat.'
              cat /tmp/cotego-health.json
              exit 1
            fi
            sleep 12
          done
          if [ "$ready" != '1' ]; then
            echo 'COTEGO Preview unavailable or football source secret missing'
            cat /tmp/cotego-health.json || true
            exit 1
          fi
          echo 'Preview API status is healthy'
      - name: Check actual Ligue 1 match feed and freshness
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://feature-cotego-premium-ux-cotego.salama-jimmy.workers.dev'
          code=$(curl --silent --show-error --max-time 25 --output /tmp/cotego-football.json --write-out '%{http_code}' "$BASE/api/football/fr.1" || true)
          if [ "$code" != '200' ] || ! jq -e '.ok==true and (.matches|length>=20) and .freshness.latestFinishedAt!=null' /tmp/cotego-football.json >/dev/null 2>&1; then
            echo 'COTEGO Preview football data missing; inspect Cloudflare Preview secret and API provider'
            head -c 700 /tmp/cotego-football.json || true
            exit 1
          fi
          echo 'Verified delayed football data available'

  browser-preview:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/feature/cotego-premium-ux'
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for UI regression checks
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check mobile and desktop navigation, modal and demo forecast
        run: node src/e2e-preview.mjs
