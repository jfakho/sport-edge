name: COTEGO tests
on:
  push:
    branches: [main, feature/fresh-football-data-adapter]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test des résultats et du proxy (sans clé réelle)
        run: node --test src/football-data-adapter.test.mjs src/worker.test.mjs
